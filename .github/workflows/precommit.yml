name: Precommit

on:
  push:
    branches: [main]
  pull_request:

env:
  MIX_ENV: test

jobs:
  check:
    name: compile, format & credo
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: mise.toml
          version-type: strict

      - name: Restore deps cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('mise.toml') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ hashFiles('mise.toml') }}-

      - name: Check lockfile is up to date
        run: mix deps.get --check-locked

      - name: Check unused deps
        run: mix deps.unlock --unused && git diff --exit-code mix.lock

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Check formatting
        run: mix format --check-formatted

      - name: Credo
        run: mix credo --strict

  frontend:
    name: vp check & build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: assets

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js and pnpm
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node pnpm

      # Node and pnpm come from mise.toml, so Vite+ must not manage its own.
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-manager: false
          package-manager: false
          cache: true

      - name: Format, lint & type-check
        run: vp check

      - name: Build
        run: vp build
